name: Sync PRDs to wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/prd/**'
      - 'scripts/sync-wiki.mjs'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone wiki
        run: git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" /tmp/wiki

      - name: Generate wiki pages
        run: node scripts/sync-wiki.mjs /tmp/wiki

      - name: Commit and push
        working-directory: /tmp/wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already up to date"
          else
            git commit -m "docs: sync PRDs from docs/prd @ ${GITHUB_SHA::7}"
            git push
          fi
